databases:
  - name: pactra-db
    plan: free
    databaseName: pactra
    user: pactra

services:
  - type: web
    name: pactra-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: pactra-db
          property: connectionString
      - key: AI_ENABLED
        value: false
      - key: PAYPAL_PAYOUTS_ENABLED
        value: false
      - key: PAYPAL_MOCK_MODE
        value: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_TEST_RECIPIENT_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: CORS_ORIGINS
        value: https://pactra.onrender.com
      - key: FRONTEND_URL
        value: https://pactra.onrender.com
      - key: BACKEND_URL
        value: https://pactra-api.onrender.com
      - key: POLICY_CONFIG_PATH
        value: ./backend/policy.json

  - type: web
    name: pactra
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https://pactra-api.onrender.com; font-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: VITE_API_URL
        value: https://pactra-api.onrender.com
