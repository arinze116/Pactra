name: Production health monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pactra-production-health
  cancel-in-progress: true

jobs:
  health:
    name: Public health and readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11.10"
      - name: Check public production health
        run: >-
          python -m scripts.check_public_health
          --base-url https://pactra-nine.vercel.app
          --timeout-seconds 10
          --max-latency-ms 5000
          --json
