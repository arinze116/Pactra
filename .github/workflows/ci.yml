name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-sqlite:
    name: "Backend \u2014 SQLite"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: test
      SECRET_KEY: ci-only-secret-key-with-at-least-32-bytes
      DATABASE_URL: sqlite:////tmp/pactra-ci-sqlite.db
      AI_ENABLED: "false"
      PAYPAL_PAYOUTS_ENABLED: "false"
      PAYPAL_MOCK_MODE: "true"
      PAYPAL_BASE_URL: https://api-m.sandbox.paypal.com
      SESSION_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11.10"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: pytest -q

  backend-postgresql:
    name: "Backend \u2014 PostgreSQL"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pactra
          POSTGRES_PASSWORD: pactra
          POSTGRES_DB: pactra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pactra -d pactra_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      SECRET_KEY: ci-only-secret-key-with-at-least-32-bytes
      DATABASE_URL: postgresql+psycopg://pactra:pactra@localhost:5432/pactra_test
      AI_ENABLED: "false"
      PAYPAL_PAYOUTS_ENABLED: "false"
      PAYPAL_MOCK_MODE: "false"
      PAYPAL_BASE_URL: https://api-m.sandbox.paypal.com
      SESSION_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11.10"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pip_audit -r requirements.txt
      - run: alembic upgrade head
      - run: pytest -q

  frontend:
    name: "Frontend \u2014 lint, build and audits"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend

  e2e:
    name: "E2E \u2014 journeys, WCAG and homepage Lighthouse"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pactra
          POSTGRES_PASSWORD: pactra
          POSTGRES_DB: pactra_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pactra -d pactra_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      SECRET_KEY: ci-only-secret-key-with-at-least-32-bytes
      DATABASE_URL: postgresql+psycopg://pactra:pactra@localhost:5432/pactra_e2e
      AI_ENABLED: "false"
      PAYPAL_PAYOUTS_ENABLED: "false"
      PAYPAL_MOCK_MODE: "false"
      PAYPAL_BASE_URL: https://api-m.sandbox.paypal.com
      CORS_ORIGINS: http://127.0.0.1:5173
      FRONTEND_URL: http://127.0.0.1:5173
      VITE_API_URL: http://127.0.0.1:8000
      SESSION_COOKIE_SECURE: "false"
      DEMO_DATABASE_URL: postgresql+psycopg://pactra:pactra@localhost:5432/pactra_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11.10"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm run test:demo
        working-directory: frontend
      - name: Lighthouse budgets
        working-directory: frontend
        shell: bash
        run: |
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/pactra-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          export CHROME_PATH
          CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux*/chrome' | head -n 1)"
          test -n "$CHROME_PATH"
          npx lighthouse http://127.0.0.1:4173/ --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices --output=json --output-path=/tmp/pactra-lighthouse.json --quiet
          npm run test:lighthouse:assert -- /tmp/pactra-lighthouse.json
