name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pactra
          POSTGRES_PASSWORD: pactra
          POSTGRES_DB: pactra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pactra -d pactra_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      SECRET_KEY: ci-only-secret-key-with-at-least-32-bytes
      DATABASE_URL: postgresql+psycopg://pactra:pactra@localhost:5432/pactra_test
      AI_ENABLED: "false"
      PAYPAL_PAYOUTS_ENABLED: "false"
      PAYPAL_MOCK_MODE: "false"
      PAYPAL_BASE_URL: https://api-m.sandbox.paypal.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pip_audit -r requirements.txt
      - run: alembic upgrade head
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend

  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pactra
          POSTGRES_PASSWORD: pactra
          POSTGRES_DB: pactra_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pactra -d pactra_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      SECRET_KEY: ci-only-secret-key-with-at-least-32-bytes
      DATABASE_URL: postgresql+psycopg://pactra:pactra@localhost:5432/pactra_e2e
      AI_ENABLED: "false"
      PAYPAL_PAYOUTS_ENABLED: "false"
      PAYPAL_MOCK_MODE: "false"
      PAYPAL_BASE_URL: https://api-m.sandbox.paypal.com
      CORS_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      VITE_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Lighthouse budgets
        working-directory: frontend
        shell: bash
        run: |
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/pactra-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          export CHROME_PATH
          CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux*/chrome' | head -n 1)"
          test -n "$CHROME_PATH"
          npx lighthouse http://127.0.0.1:4173/ --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices --output=json --output-path=/tmp/pactra-lighthouse.json --quiet
          npm run test:lighthouse:assert -- /tmp/pactra-lighthouse.json
